  SETUP INSTRUCTIONS
  1. Go to https://console.firebase.google.com and create a NEW project (e.g. "last-ember-log").
  2. In that project, enable Firestore Database (start in production mode).
  3. In Firestore Rules, set read/write to true for now (lock down later if you want):
       rules_version = '2';
       service cloud.firestore { match /databases/{database}/documents { match /{document=**} { allow read, write: if true; } } }
  4. Project settings > General > Your apps > Web app > copy the firebaseConfig object.
  5. Paste it into FIREBASE_CONFIG below, replacing the placeholder.
  6. Push this file to a GitHub repo, enable GitHub Pages on it, done.

  Note: images are stored as compressed base64 data directly in Firestore documents,
  not in Firebase Storage — this avoids needing the paid Blaze plan entirely.

<style>
:root{
  --bg:#060814; --panel:#0D1326; --panel-raised:#131B33; --panel-hover:#182246;
  --text:#E8ECF5; --text-soft:#8B93B0; --text-faint:#565F7D;
  --amber:#FFB454; --amber-glow:rgba(255,180,84,.35); --amber-bg:rgba(255,180,84,.08);
  --teal:#4FE0C4; --teal-glow:rgba(79,224,196,.35); --teal-bg:rgba(79,224,196,.08);
  --danger:#FF6B5E; --danger-bg:rgba(255,107,94,.1);
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:2.5rem 1.5rem 5rem}
.mono{font-family:'Space Mono',monospace}
.display{font-family:'Orbitron',sans-serif;letter-spacing:.04em}
.masthead{text-align:center;margin-bottom:2rem}
.masthead h1{font-size:24px;font-weight:700;margin:0;color:var(--text);text-shadow:0 0 20px var(--amber-glow)}
.masthead p{margin:.5rem 0 0;color:var(--text-soft);font-size:13px;letter-spacing:.05em}
.tabs{display:flex;gap:8px;margin-bottom:1.5rem;justify-content:center}
.tab{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.05em;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 20px;cursor:pointer;color:var(--text-soft);transition:.2s}
.tab:hover{border-color:var(--border-strong);color:var(--text)}
.tab.active{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);box-shadow:0 0 16px var(--amber-glow)}
.page{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.75rem}
.section-label{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.grid-compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid-compact .card{padding:8px}
.grid-compact .card-thumb,.grid-compact .card-thumb-placeholder{max-height:70px;margin-bottom:6px}
.grid-compact .card h3{font-size:12px}
.grid-compact .role,.grid-compact .origin{font-size:10px}
.card{background:var(--panel-raised);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.2s;position:relative}
.card:hover{border-color:var(--border-strong);background:var(--panel-hover);transform:translateY(-1px)}
.card-thumb{width:100%;aspect-ratio:1/1;border-radius:6px;object-fit:cover;margin-bottom:10px;background:var(--bg)}
.card-thumb-placeholder{width:100%;aspect-ratio:1/1;border-radius:6px;margin-bottom:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:11px;border:1px dashed var(--border-strong)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.card h3{font-size:15px;font-weight:500;margin:0}
.seal{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:600}
.seal.on{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);box-shadow:0 0 10px var(--amber-glow)}
.seal.off{background:transparent;border:1px solid var(--text-faint);color:var(--text-faint)}
.card .role{font-size:12px;color:var(--text-soft);margin:0 0 6px}
.card .origin{font-size:11px;color:var(--text-faint)}
button{font-family:'Space Grotesk',sans-serif;font-size:14px;background:var(--panel-hover);border:1px solid var(--border-strong);border-radius:6px;padding:11px 16px;cursor:pointer;color:var(--text);transition:.2s;min-height:44px}
button:hover{border-color:var(--amber);color:var(--amber)}
button.primary{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
input,textarea,select{font-family:'Space Grotesk',sans-serif;font-size:16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);width:100%;min-height:44px}
textarea{min-height:80px}
input:focus,textarea:focus{outline:none;border-color:var(--amber)}
.pc-row{display:grid;grid-template-columns:1fr 1fr 1fr 100px;gap:8px;align-items:end;margin-bottom:10px}
.pc-row label{font-size:10px;color:var(--text-faint);display:block;margin-bottom:3px;letter-spacing:.04em}
.summary-bar{margin:1rem 0;padding:10px 14px;background:var(--teal-bg);border:1px solid var(--teal);border-radius:8px;font-size:13px;color:var(--teal)}
.summary-bar.summary-warn{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.loc-card.discovered{border-color:var(--teal)}
.log-entry{border-bottom:1px solid var(--border);padding:14px 0}
.log-entry:last-child{border-bottom:none}
.log-entry .ts{font-size:11px;color:var(--text-faint)}
.log-add{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
.log-add textarea{min-height:60px}
.hint{font-size:12px;color:var(--text-faint);margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(2,4,12,.75);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--panel);border:1px solid var(--border-strong);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:1.75rem;box-shadow:0 0 40px rgba(0,0,0,.5)}
.modal-close{float:right;background:transparent;border:none;color:var(--text-soft);font-size:20px;cursor:pointer;padding:0 4px}
.upload-zone{border:1px dashed var(--border-strong);border-radius:8px;padding:1.25rem;text-align:center;margin-bottom:14px;cursor:pointer}
.upload-zone:hover{border-color:var(--amber)}
.field{margin-bottom:12px}
.field label{font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.status-pill{font-size:11px;padding:4px 10px;border-radius:20px;font-family:'Space Mono',monospace}
.status-alive{background:var(--teal-bg);color:var(--teal)}
.status-fallen{background:var(--danger-bg);color:var(--danger)}
.grid-wrap{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;position:relative;scroll-snap-type:x proximity}
.starmap-outer{display:inline-grid;grid-template-columns:28px repeat(14,44px);grid-template-rows:24px repeat(10,44px);gap:0}
.gcol-label,.grow-label{display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);scroll-snap-align:start}
.swipe-hint{display:none;text-align:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:6px}
.gcell{border:1px solid var(--border);position:relative;background:var(--panel-raised)}
.gcell:hover{background:var(--panel-hover)}
.gmarker{position:absolute;inset:3px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;overflow:hidden;line-height:1.05}
.add-loc-form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:1rem;align-items:end}
.add-loc-form .field label{margin-bottom:3px}
.add-crew-form{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-top:1rem;align-items:end}
.add-crew-form .field label{margin-bottom:3px}
.swatches{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.selected{border-color:var(--text)}
.status-other{background:rgba(180,140,255,.1);color:#B48CFF}
.status-damaged{background:var(--amber-bg);color:var(--amber)}
.status-offline{background:rgba(255,255,255,.08);color:var(--text-faint)}
.legend-bar{display:flex;gap:10px;align-items:end;margin-bottom:1rem}
.legend-bar .field{flex:1;margin-bottom:0}
.log-actions{display:flex;gap:8px;margin-top:6px}
.log-actions button{font-size:12px;padding:8px 12px;min-height:38px}
.sig{font-family:'Space Mono',monospace;font-size:11px;color:var(--amber);margin-top:6px}
/* ===== VOID GLASS REFRESH ===== */
:root{
  --bg:#04060F; --panel:rgba(14,20,40,.55); --panel-raised:rgba(24,34,64,.45); --panel-hover:rgba(40,56,100,.5);
  --border:rgba(140,190,255,.12); --border-strong:rgba(140,220,255,.28);
  --glass-blur:blur(18px) saturate(140%);
  --edge:linear-gradient(135deg,rgba(79,224,196,.55),rgba(255,255,255,.04) 40%,rgba(255,180,84,.4));
}
html,body{background:var(--bg)}
body{background:
  radial-gradient(900px 600px at 15% -10%,rgba(79,224,196,.14),transparent 60%),
  radial-gradient(800px 600px at 100% 10%,rgba(120,90,255,.13),transparent 60%),
  radial-gradient(900px 700px at 50% 120%,rgba(255,180,84,.10),transparent 60%),
  var(--bg);background-attachment:fixed}
.masthead h1{font-size:28px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#E8ECF5,var(--teal) 50%,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(79,224,196,.35))}
.masthead p{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:var(--text-soft)}
.tabs{padding:6px;border-radius:14px;background:rgba(10,14,30,.5);border:1px solid var(--border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;overflow-x:auto}
.tab{background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 18px;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.05);border-color:transparent}
.tab.active{background:linear-gradient(135deg,rgba(79,224,196,.18),rgba(255,180,84,.14));border-color:rgba(140,220,255,.35);color:var(--text);box-shadow:0 0 22px rgba(79,224,196,.22),inset 0 0 12px rgba(255,255,255,.04)}
.page,.card,.modal,.summary-bar{backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.page{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.card{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .25s ease,border-color .25s,box-shadow .25s,background .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(79,224,196,.45);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 24px rgba(79,224,196,.14),inset 0 1px 0 rgba(255,255,255,.08)}
.card-thumb,.card-thumb-placeholder{border-radius:10px}
.section-label{display:flex;align-items:center;gap:10px;letter-spacing:.22em}
.section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border-strong),transparent)}
button{border-radius:10px;background:rgba(255,255,255,.05);border-color:var(--border);backdrop-filter:blur(8px)}
button:hover{border-color:var(--teal);color:var(--teal);box-shadow:0 0 16px var(--teal-glow)}
button.primary{background:linear-gradient(135deg,rgba(79,224,196,.2),rgba(255,180,84,.16));border-color:rgba(140,220,255,.4);color:var(--text)}
button.primary:hover{box-shadow:0 0 22px var(--teal-glow);color:#fff}
input,textarea,select{background:rgba(4,8,20,.55);border-radius:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(79,224,196,.15)}
.overlay{background:rgba(2,4,12,.6);backdrop-filter:blur(10px)}
.modal{border-radius:20px;background:rgba(12,18,38,.78);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(79,224,196,.08),inset 0 1px 0 rgba(255,255,255,.08)}
.status-pill{border:1px solid currentColor;background:transparent;letter-spacing:.04em}
.status-alive{box-shadow:0 0 10px var(--teal-bg)}
.summary-bar{border-radius:12px}
.log-entry{border-bottom:1px solid var(--border);padding:16px 0 16px 16px;position:relative;border-left:1px solid var(--border-strong);margin-left:6px}
.log-entry::before{content:"";position:absolute;left:-4px;top:22px;width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.log-entry:last-child{border-bottom:none}
.log-entry .ts{letter-spacing:.08em}
.sig{color:var(--teal)}
.gcell{background:rgba(79,224,196,.025);border-color:rgba(79,224,196,.1)}
.gcell:hover{background:rgba(79,224,196,.12)}
.starmap-outer{padding:6px;border-radius:12px;background:radial-gradient(circle at 50% 50%,rgba(79,224,196,.06),transparent 70%)}
.gmarker{box-shadow:0 0 14px currentColor}
.legend-bar{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03)}
.upload-zone{border-radius:12px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(140,220,255,.2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){.star{animation:none}.card,.tab,button{transition:none}}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:1.25rem .85rem 3rem}
  .masthead{margin-bottom:1.25rem}
  .masthead h1{font-size:20px;letter-spacing:.1em}
  .page{padding:1rem;border-radius:10px}
  .tabs{gap:6px}
  .tab{padding:10px 12px;font-size:11px;flex:1}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{padding:12px}
  .add-loc-form{grid-template-columns:1fr}
  .add-crew-form{grid-template-columns:1fr}
  .legend-bar{flex-direction:column;align-items:stretch}
  .starmap-outer{grid-template-columns:24px repeat(14,38px);grid-template-rows:22px repeat(10,38px)}
  .swipe-hint{display:block}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:14px 14px 0 0;max-height:92vh;padding:1.25rem;-webkit-overflow-scrolling:touch}
  .swatch{width:36px;height:36px}
}

.daybar{display:inline-flex;align-items:center;gap:14px;margin:14px auto 0;padding:8px 20px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(10,14,30,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 24px rgba(79,224,196,.12)}
.daybar .lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;color:var(--text-soft);text-transform:uppercase}

const seedLog=()=>{
  const e=(i,ts,type,text)=>({id:"log_seed"+i,ts,t:1790000000000+i*1000,session:i<=4?1:2,type,sig:"",text});
  return [
    e(1,"Session 1","Conversation","Five strangers, one coin. Each of us was found alone by the same halfling, Kessa Vane, who talked with us first about what we could actually do, then pressed a worn coin into our hand with one destination: Vigil's Edge. Prince Thomas himself had asked him to do it."),
    e(2,"Session 1","Discovery","Vigil's Edge. Lord Jeronim met us at the doors and asked to see our coins. At the round table, with Prince Thomas at his side, we learned Belerdieu has fought an unexplained invasion for two years. Two pieces of evidence came out of it: a crystalline fragment, and a damaged beacon from a wreck that matches nothing Earth builds. The captured creature was humanoid with skin unlike anything native to Earth. We were told twice that the Superiors' Conclave must never learn of this."),
    e(3,"Session 1","Conversation","Ilyra Jeronim, Lord Jeronim's granddaughter, showed us what she built: an artifact capable of planar shifting, untested at any real scale. She chose the five of us for our skills and handed us candidate files for two more seats. We chose Brakka Stonefel, a 61-year-old dwarven engineer who keeps impossible machines running, and Dr. Reya Finch, a 28-year-old Tiefling physician trained on an active battlefield. Ilyra walked us through the ship, deck by deck, and we boarded."),
    e(4,"Session 1","Discovery","The Last Ember launched and Ilyra activated the artifact. We surfaced somewhere vast and strange, near a city none of us could name. The ship's one real flaw showed at once: Ilyra can move it freely, but she can't see where she's steering, so docking took all of us."),
    e(5,"Session 2","Conversation","Docked at Anchorlight. Two seven-foot gentle giants with matching shoulder patches escorted us off the ship, one calm and professional, the other thrilled that visitors had come. They sent us to the Hollow Lantern: a garden-shed-sized house hiding a hundred-foot tavern. Behind the bar, a devil called Tavern (\"princes and princesses\") who runs it with his brothers Bar and Pub. Gale left Thistle on the ship with Ilyra. She seemed settled."),
    e(6,"Session 2","Conversation","Emeric, at a table across the room, then a private numbered room. He explained how Material Plane folk are treated out here, the difference between the Veil and the Weave, why planar shifting is dangerous, and which pirate factions to avoid. He is the last person from a Material Plane to reach Anchorlight before us. He asked why we're here; we told him nothing. He noticed, didn't push, and said that if we ever need something he'll be there. He pointed us to the Chart House, the Bazaar and the Fighting Pits."),
    e(7,"Session 2","Mystery","The Chart House: a whole building of a hundred years of records. The elf described the alien species to an older man with glasses; the search will take a few hours and cost depends on what turns up. Lola drew The Fool for the first time and felt urgency. The clerk knew what it resembled but wouldn't say more: dangerous knowledge that people keep close. Gale tried to read where the Beacon points, and Lola, from her card, landed on the same place. Not Anchorlight itself."),
    e(8,"Session 2","Discovery","The Bazaar. Xzavier haggled a cracked porthole down to two Anchors at General Salvage, then learned gold doesn't spend here and exchanged it at the ATM (real name Adam T. Morrow). Exotic pets were far out of budget. The Information Brokers offered a cheaper species search than the Chart House but promised nothing. We passed."),
    e(9,"Session 2","Combat","The Fighting Pits. Matches come from a ledger of real grudges and debts, not open sign-ups. A Bare Ring slot opened as Kaldon arrived, and the crowd named him \"Supreme Calzone.\" The Leonin knocked him down early and out-punched him head-on, nearly breaking his hand, but Kaldon finished it with a full suplex. Winner: 95 Anchors."),
    e(10,"Session 2","Mystery","Thistle got loose and tore through town looking for Gale. Brakka and the guards chased her; Gale and Xzavier reached her first. The guards' terms: pay, or be banned from ever leaving Anchorlight. Brakka couldn't explain how Thistle got out, and gave Xzavier a feather of sending so whoever holds it can reach her anywhere. The holes in the walls were bigger than an adolescent bear should make."),
    e(11,"Session 2","Mystery","Back at the Pits the lanterns chimed and the crowd shouted \"Surge!\" During it, both Thistle and Kaldon visibly grew, then returned to normal. Nobody knows why. Gale came away unsettled; Kaldon, if anything, seemed steadier."),
    e(12,"Session 2","Conversation","No open slots at the Pits, so the elf booked a Bound Ring amateur match two days out. Our fake scuffle near the rings got no reaction from the guards. Kaldon paid off the Thistle debt from his winnings. Session ended outside the Hollow Lantern: still no destination for the Beacon, the species search still running, and two threads, Gale's Beacon and Lola's card, pointing the same way.")
  ];
};

// ---- auto-link names ----
let _lk=null;
function buildLinks(){
  const map={}, names=[];
  const add=(name,kind,col,id)=>{
    if(!name||name.length<3)return;
    const k=esc(name);
    if(map[k])return;
    map[k]={kind,col,id}; names.push(k);
  };
  const TITLES=/^(Lord|Lady|Prince|Princess|Dr\.|King|Queen|Captain|Mad'am|Miss|The)\s+/;
  state.npcs.forEach(n=>{
    const base=(n.name||"").split(" — ")[0];
    add(base,"npc","npcs",n.id);
    (n.aka||[]).forEach(a=>add(a,"npc","npcs",n.id));
    const stripped=base.replace(TITLES,"");
    const parts=stripped.split(" ");
    if(parts.length>1&&stripped!==base)add(parts[parts.length-1],"npc","npcs",n.id);
    else if(parts.length>1&&parts[0].length>=4)add(parts[0],"npc","npcs",n.id);
  });
  state.crew.forEach(c=>{
    if(!c.name)return;
    add(c.name,"crew","crew",c.id);
    const first=c.name.replace(TITLES,"").split(" ")[0];
    if(first&&first!==c.name&&first.length>=4)add(first,"crew","crew",c.id);
  });
  state.locations.forEach(l=>add(l.name,"loc","locations",l.id));
  state.codex.forEach(x=>{ add(x.term,"codex","codex",x.id); (x.aka||[]).forEach(a=>add(a,"codex","codex",x.id)); });
  if(!names.length)return {re:null,map};
  names.sort((a,b)=>b.length-a.length);
  const re=new RegExp("(^|[^A-Za-z0-9])("+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![A-Za-z0-9])","g");
  return {re,map};
}
function linkify(text){
  const t=esc(text);
  if(!_lk)_lk=buildLinks();
  if(!_lk.re)return t;
  return t.replace(_lk.re,(m,pre,name)=>{
    const r=_lk.map[name]; if(!r)return m;
    return pre+'<a class="xref '+r.kind+'" onclick="event.stopPropagation();gotoRef(\''+r.col+'\',\''+r.id+'\')">'+name+'</a>';
  });
}

async function seedV3(){
  if(!db)return;
  try{
    const flag=await db.collection("meta").doc(SEED3_FLAG).get();
    if(flag.exists)return;
    const items=seedCodex();
    await seed("codex",items);
    items.forEach(i=>{ if(!state.codex.some(x=>x.id===i.id))state.codex.push(i); });
    // tag the seeded log entries with their session, and give seeded NPCs link nicknames
    for(let i=1;i<=12;i++){
      const id="log_seed"+i, sess=i<=4?1:2;
      const e=state.log.find(x=>x.id===id); if(e&&!e.session){ e.session=sess; db.collection("log").doc(id).update({session:sess}).catch(()=>{}); }
    }
    Object.keys(NPC_AKA).forEach(id=>{
      const n=state.npcs.find(x=>x.id===id); if(n&&!n.aka){ n.aka=NPC_AKA[id]; db.collection("npcs").doc(id).update({aka:NPC_AKA[id]}).catch(()=>{}); }
    });
    await db.collection("meta").doc(SEED3_FLAG).set({value:true});
  }catch(e){ console.warn("Codex seeding failed (non-critical):",e); }
}

async function loadAll(){
  if(!db){
    state.crew=defaultCrew(); state.ship=defaultShip(); state.locations=defaultLocations(); state.cargo=defaultCargo(); state.log=[]; state.legend=DEFAULT_LEGEND;
    state.npcs=defaultNpcs(); state.codex=seedCodex(); state.quests=seedQuests(); state.log=seedLog(); state.locations=seedLocations(); state.cargo=defaultCargo().concat(seedCargoExtras()); state.shipPos={coord:"G5",trail:[]};
    initSeen();
    render();
    return;
  }
  try{
    const timeout=(ms)=>new Promise((_,reject)=>setTimeout(()=>reject(new Error("Firestore timed out after "+ms+"ms")),ms));
    const [crewSnap,shipSnap,locSnap,cargoSnap,logSnap]=await Promise.race([
      Promise.all([
        getQ(db.collection("crew")), getQ(db.collection("ship")),
        getQ(db.collection("locations")), getQ(db.collection("cargo")), getQ(db.collection("log"))
      ]),
      timeout(20000)
    ]);
    const [crewData, shipData, locData, cargoData] = await Promise.all([
      crewSnap.empty ? seed("crew",defaultCrew()) : Promise.resolve(crewSnap.docs.map(d=>d.data())),
      shipSnap.empty ? seed("ship",defaultShip()) : Promise.resolve(shipSnap.docs.map(d=>d.data())),
      locSnap.empty ? seed("locations",defaultLocations()) : Promise.resolve(locSnap.docs.map(d=>d.data())),
      cargoSnap.empty ? seed("cargo",defaultCargo()) : Promise.resolve(cargoSnap.docs.map(d=>d.data()))
    ]);
    state.crew = crewData;
    state.ship = shipData;
    state.locations = locData;
    state.cargo = cargoData;
    state.log = logSnap.docs.map(d=>d.data());
  }catch(e){
    console.error("Firebase not configured yet, running in local-only preview mode.",e);
    state.crew=defaultCrew(); state.ship=defaultShip(); state.locations=defaultLocations(); state.cargo=defaultCargo(); state.log=[];
  }
  // Grid legend is optional flavor — fetch separately so it can never break the rest of the app if it fails.
  try{
    const legendSnap = await getQ(db.collection("meta").doc("gridLegend"));
    state.legend = (legendSnap.exists && legendSnap.data().value) ? legendSnap.data().value : DEFAULT_LEGEND;
  }catch(e){
    console.warn("Grid legend fetch failed (non-critical):",e);
    state.legend = DEFAULT_LEGEND;
  }
  // Quests and day counter are fetched separately so a failure can't break the rest of the app.
  try{
    const qs=await getQ(db.collection("quests"));
    state.quests=qs.docs.map(d=>d.data());
  }catch(e){ console.warn("Quests fetch failed (non-critical):",e); state.quests=[]; }
  try{
    const ds=await getQ(db.collection("meta").doc("days"));
    state.days=(ds.exists && Number.isFinite(ds.data().value)) ? ds.data().value : 0;
  }catch(e){ console.warn("Day counter fetch failed (non-critical):",e); state.days=0; }
  try{
    const ns=await getQ(db.collection("npcs"));
    if(ns.empty){
      const fl=await db.collection("meta").doc("npcsSeeded").get();
      if(!fl.exists){ state.npcs=await seed("npcs",defaultNpcs()); await db.collection("meta").doc("npcsSeeded").set({value:true}); }
      else state.npcs=[];
    } else state.npcs=ns.docs.map(d=>d.data());
  }catch(e){ console.warn("NPC fetch failed (non-critical):",e); state.npcs=[]; }
  try{
    const sp=await getQ(db.collection("meta").doc("shipPos"));
    if(sp.exists)state.shipPos={coord:sp.data().coord||"",trail:sp.data().trail||[]};
  }catch(e){ console.warn("Ship position fetch failed (non-critical):",e); }
  try{ const cx=await getQ(db.collection("codex")); state.codex=cx.docs.map(d=>d.data()); }catch(e){ console.warn("Codex fetch failed (non-critical):",e); state.codex=[]; }
  try{ const cs=await getQ(db.collection("meta").doc("currentSession")); if(cs.exists&&cs.data().value)state.curSession=cs.data().value; }catch(e){}
  await seedOnce();
  await seedV3();
  state.log.sort((a,b)=>logTime(b)-logTime(a));
  initSeen();
  render();
}
async function seed(col,items){
  if(!db)return items;
  await Promise.all(items.map(item=>db.collection(col).doc(item.id).set(item).catch(()=>{})));
  return items;
}
async function saveDoc(col,item){
  if(!db){
    alert("Firebase isn't connected — your FIREBASE_CONFIG still has placeholder values (or something failed to initialize). Nothing will save. Check the config block near the top of this file.");
    return;
  }
  try{ await fsWait(db.collection(col).doc(item.id).set(item)); }
  catch(e){
    console.warn("save failed",e);
    alert("That change didn't save — it'll be lost on refresh. (Reason: "+(e.message||e)+")");
  }
}

// ---- undo ----
function showUndo(msg,fn){
  const t=document.getElementById("toast"); if(!t)return;
  clearTimeout(window._undoT);
  window._undoFn=fn;
  t.innerHTML='<span>'+esc(msg)+'</span><button onclick="doUndo()">UNDO</button>';
  t.classList.add("show");
  window._undoT=setTimeout(()=>{ t.classList.remove("show"); window._undoFn=null; },10000);
}
async function doUndo(){
  const fn=window._undoFn; if(!fn)return;
  window._undoFn=null; clearTimeout(window._undoT);
  document.getElementById("toast").classList.remove("show");
  await fn();
}
window.doUndo=doUndo;
async function removeItem(col,id){
  const arr=state[col]; const idx=arr.findIndex(x=>x.id===id); if(idx<0)return;
  const item=arr[idx];
  state[col]=arr.filter(x=>x.id!==id);
  if(db){ try{ await fsWait(db.collection(col).doc(id).delete()); }catch(e){} }
  const label=item.name||item.term||(item.text?item.text.slice(0,24)+"…":"Item");
  showUndo("“"+label+"” deleted",async()=>{
    const a=state[col]; a.splice(Math.min(idx,a.length),0,item);
    await saveDoc(col,item); render();
  });
}

function onSearch(v){ searchQ=v.trim(); render(); }

function searchAll(q){
  const ql=q.toLowerCase(), out=[];
  const hit=(fields)=>{ const t=fields.filter(Boolean).join(" · "); return t.toLowerCase().includes(ql)?t:null; };
  state.crew.forEach(c=>{const t=hit([c.name,c.role,c.origin,c.race,c.note]); if(t)out.push({type:"Crew",open:"openModal('crew','"+c.id+"')",title:c.name||"Unnamed",text:t});});
  state.ship.forEach(c=>{const t=hit([c.name,c.status,c.note]); if(t)out.push({type:"Ship",open:"openModal('ship','"+c.id+"')",title:c.name,text:t});});
  state.cargo.forEach(c=>{const t=hit([c.name,c.qty,c.cat,c.note]); if(t)out.push({type:c.cat==="Papers"?"Papers":"Cargo",open:"openModal('cargo','"+c.id+"')",title:c.name,text:t});});
  state.codex.forEach(c=>{const t=hit([c.term,c.cat,c.def,(c.aka||[]).join(" ")]); if(t)out.push({type:"Codex",open:"openCodex('"+c.id+"')",title:c.term,text:t});});
  state.npcs.forEach(c=>{const t=hit([c.name,c.role,c.where,c.attitude,c.note]); if(t)out.push({type:"NPC",open:"openModal('npcs','"+c.id+"')",title:c.name,text:t});});
  state.locations.forEach(c=>{const t=hit([c.name,c.coord,c.kind,c.note]); if(t)out.push({type:"Map",open:"openModal('locations','"+c.id+"')",title:c.name+(c.coord?" ("+c.coord+")":""),text:t});});
  state.quests.forEach(c=>{const t=hit([c.name,c.kind,c.who,c.note]); if(t)out.push({type:"Quest",open:"openQuest('"+c.id+"')",title:c.name,text:t});});
  state.log.forEach(c=>{const t=hit([c.text,c.sig]); if(t)out.push({type:"Log",open:"gotoLog('"+c.id+"')",title:c.ts+(c.sig?" — "+c.sig:""),text:t});});
  return out;
}
function snippet(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  const a=Math.max(0,i-40), b=Math.min(text.length,i+q.length+80);
  let out=esc((a>0?"…":"")+text.slice(a,b)+(b<text.length?"…":""));
  const re=new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
  return out.replace(re,m=>"<mark>"+m+"</mark>");
}
function renderSearch(p){
  const res=searchAll(searchQ);
  let h='<div class="section-label">'+res.length+' result'+(res.length===1?'':'s')+' for “'+esc(searchQ)+'”</div>';
  if(!res.length)h+='<p class="hint">Nothing matches. Try a shorter word.</p>';
  h+=res.map(r=>'<button class="result" onclick="'+r.open+'"><div class="rt"><span class="status-pill status-other">'+r.type+'</span><b>'+esc(r.title)+'</b></div><p class="rs">'+snippet(r.text,searchQ)+'</p></button>').join("");
  p.innerHTML=h;
}

    (isCargo?'<div class="field"><label>Category</label><select onchange="modalUpdate(\''+col+'\',\''+id+'\',\'cat\',this.value)"><option'+((item.cat||"Goods")==="Goods"?" selected":"")+'>Goods</option><option'+(item.cat==="Papers"?" selected":"")+'>Papers</option></select></div>':'')+

      '<div class="field"><label>Where you met them</label><input value="'+esc(item.where)+'" oninput="modalUpdate(\''+col+'\',\''+id+'\',\'where\',this.value)"/></div>'+
      '<div class="field"><label>Attitude toward the crew</label><select onchange="modalUpdate(\''+col+'\',\''+id+'\',\'attitude\',this.value)">'+ATTITUDES.map(a=>'<option'+(item.attitude===a?' selected':'')+'>'+a+'</option>').join("")+'</select></div>':'')+
    (locked?roField("Notes",item.note):'<div class="field"><label>Notes</label><textarea style="min-height:80px" oninput="modalUpdate(\''+col+'\',\''+id+'\',\'note\',this.value)">'+esc(item.note)+'</textarea></div>')+
    (isCrew&&!locked?'<button onclick="removeCrewMember(\''+id+'\')">Remove from crew</button>':'')+
    (isShip?'<button onclick="removeShipArea(\''+id+'\')">Remove area</button>':'')+
    (isCargo?'<button onclick="removeCargo(\''+id+'\')">Remove from cargo</button>':'')+
    (isNpc?'<button onclick="removeNpc(\''+id+'\')">Remove</button>':'')+
    (isLoc?'<button onclick="removeLocation(\''+id+'\')">Remove from chart</button>':'')+
  '</div></div>';
}

function resizeAndCompress(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Could not read that image file."));
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*(maxDim/w)); w=maxDim; }
        else if(h>maxDim){ w=Math.round(w*(maxDim/h)); h=maxDim; }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadImage(col,id,input){
  const file=input.files[0]; if(!file)return;
  try{
    // Start at 500px/0.7 quality, shrink further if still too big for a single Firestore document (~1MB cap).
    let dataUrl=await resizeAndCompress(file,500,0.7);
    if(dataUrl.length>700000){ dataUrl=await resizeAndCompress(file,320,0.55); }
    const item=state[col].find(x=>x.id===id); item.img=dataUrl; item.imgPos="50% 50%";
    await saveDoc(col,item);
    openModal(col,id);
  }catch(e){
    alert("Image upload failed — try a smaller image, or a different file.");
    console.error(e);
  }
}
window.uploadImage=uploadImage;

function exportMarkdown(){
  let md="# The Last Ember — Ship's Log Export\n\n";
  md+="*Exported "+new Date().toLocaleString()+"*\n\n---\n\n";

  md+="## Crew\n\n";
  state.crew.forEach(c=>{
    md+="### "+(c.name||"Unnamed")+"\n\n";
    md+="- **Role:** "+(c.role||"—")+"\n";
    md+="- **Origin:** "+(c.origin||"—")+"\n";
    md+="- **Age:** "+(c.age||"—")+" | **Race:** "+(c.race||"—")+" | **Pronouns:** "+(c.pronouns||"—")+"\n";
    md+="- **Languages:** "+(c.languages||"—")+"\n";
    md+="- **Status:** "+(c.status||"—")+"\n\n";
    md+=(c.note||"")+"\n\n---\n\n";
  });

  md+="## Ship Systems\n\n";
  state.ship.forEach(s=>{
    md+="### "+s.name+"\n\n";
    md+="- **Status:** "+s.status+"\n\n";
    md+=(s.note||"")+"\n\n---\n\n";
  });

  md+="## Locations\n\n";
  if(state.legend)md+="*Grid scale: "+state.legend+"*\n\n";
  state.locations.forEach(l=>{
    md+="### "+l.name+" ("+l.coord+")\n\n";
    md+="- **Kind:** "+(l.kind||"—")+"\n\n";
    md+=(l.note||"")+"\n\n---\n\n";
  });

  md+="## NPCs\n\n";
  state.npcs.forEach(n=>{ md+="### "+n.name+"\n\n- **Role:** "+(n.role||"—")+" | **Attitude:** "+(n.attitude||"—")+(n.where?" | **Met:** "+n.where:"")+"\n\n"+(n.note||"")+"\n\n---\n\n"; });
  md+="## Codex\n\n";
  state.codex.slice().sort((a,b)=>(a.cat||"").localeCompare(b.cat||"")||(a.term||"").localeCompare(b.term||"")).forEach(x=>{ md+="### "+x.term+" ("+(x.cat||"—")+")\n\n"+(x.def||"")+(x.src?"\n\n*Learned from: "+x.src+"*":"")+"\n\n---\n\n"; });
  md+="## Quests, Leads & Debts\n\n";
  state.quests.forEach(q=>{
    md+="### "+q.name+"\n\n- **Type:** "+(q.kind||"—")+" | **Status:** "+(q.status||"—")+(q.who?" | **Who:** "+q.who:"")+"\n\n"+(q.note||"")+"\n\n---\n\n";
  });
  md+="## Captain's Log\n\n*Days in the Distant Plane: "+state.days+"*\n\n";
  state.log.slice().reverse().forEach(e=>{
    md+="**"+e.ts+"**"+(e.sig?" — signed "+e.sig:"")+"\n\n"+e.text+"\n\n---\n\n";
  });

  const blob=new Blob([md],{type:"text/markdown"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="last-ember-log-"+new Date().toISOString().slice(0,10)+".md";
  a.click();
  URL.revokeObjectURL(url);
}
window.exportMarkdown=exportMarkdown;

<button id="musicBtn" type="button" aria-label="Toggle ambient music">♪ SOUND OFF</button>
<script>
/* Ambient sea-chantey: generated live from a Dorian scale, so it never loops the same way twice. */
(function(){
  var ctx=null,master,running=false,timer=null,last=4,pad=[];
  var btn=document.getElementById("musicBtn");
  var SC=[293.66,329.63,349.23,392.00,440.00,493.88,523.25,587.33,659.25]; // D Dorian
  function pluck(f,t,v){
    var o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;
    lp.type="lowpass";lp.frequency.setValueAtTime(2200,t);lp.frequency.exponentialRampToValueAtTime(500,t+1.2);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(master);g.connect(wet);
    o.start(t);o2.start(t);o.stop(t+2.3);o2.stop(t+2.3);
  }
  var wet;
  function build(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    var d=ctx.createDelay(1);d.delayTime.value=.42;var fb=ctx.createGain();fb.gain.value=.38;
    var dl=ctx.createBiquadFilter();dl.type="lowpass";dl.frequency.value=1800;
    wet=ctx.createGain();wet.gain.value=.5;wet.connect(d);d.connect(dl);dl.connect(fb);fb.connect(d);dl.connect(master);
    // soft drone pad (D + A), slowly breathing
    [146.83,220,293.66].forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
      o.type="sine";o.frequency.value=f;g.gain.value=.025;
      l.frequency.value=.05+i*.03;lg.gain.value=.015;l.connect(lg);lg.connect(g.gain);
      o.connect(g);g.connect(master);o.start();l.start();pad.push(o,l);
    });
    // gentle waves: filtered noise swelling slowly
    var len=ctx.sampleRate*3,buf=ctx.createBuffer(1,len,ctx.sampleRate),a=buf.getChannelData(0);
    for(var i=0;i<len;i++)a[i]=Math.random()*2-1;
    var n=ctx.createBufferSource();n.buffer=buf;n.loop=true;
    var nf=ctx.createBiquadFilter();nf.type="lowpass";nf.frequency.value=420;
    var ng=ctx.createGain();ng.gain.value=.018;
    var nl=ctx.createOscillator(),nlg=ctx.createGain();nl.frequency.value=.09;nlg.gain.value=.014;nl.connect(nlg);nlg.connect(ng.gain);
    n.connect(nf);nf.connect(ng);ng.connect(master);n.start();nl.start();
  }
  function bell(f,t,v,d){
    [[1,1],[2.76,.35],[5.4,.12]].forEach(function(pr){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f*pr[0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*pr[1],t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(master);g.connect(wet);o.start(t);o.stop(t+d+.1);
    });
  }
  // little sound effects; only play while sound is switched on
  window.emberSfx=function(kind){
    if(!running||!ctx)return;
    var t=ctx.currentTime+.02;
    if(kind==="log"){bell(587.33,t,.09,1.8);bell(880,t+.16,.07,2.2);}
    else if(kind==="quest"){pluck(392,t,.1);pluck(493.88,t+.12,.1);pluck(587.33,t+.24,.1);}
    else if(kind==="resolve"){[293.66,369.99,440,587.33].forEach(function(f,i){bell(f,t+i*.11,.08,2.4);});}
    else if(kind==="coin"){bell(1318.5,t,.05,.5);bell(1760,t+.07,.05,.7);}
    else if(kind==="toll"){bell(146.83,t,.16,3.2);}
  };
  function next(){
    if(!running)return;
    var t=ctx.currentTime+.05;
    // random walk, mostly stepwise; occasional rest keeps it airy
    if(Math.random()>.28){
      var step=[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)];
      last=Math.max(0,Math.min(SC.length-1,last+step));
      pluck(SC[last],t,.07+Math.random()*.03);
      if(Math.random()<.18)pluck(SC[Math.max(0,last-2)]/2,t,.05);
    }
    timer=setTimeout(next,(Math.random()<.2?1100:620)+Math.random()*500);
  }
  function setOn(on){
    if(on){
      if(!ctx)build();
      if(ctx.resume)ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(.9,ctx.currentTime+3);
      running=true;next();
      btn.textContent="♪ SOUND ON";btn.classList.add("on");
    }else{
      running=false;clearTimeout(timer);
      if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+1.2);}
      btn.textContent="♪ SOUND OFF";btn.classList.remove("on");
    }
    try{localStorage.setItem("emberMusic",on?"1":"0")}catch(e){}
  }
  btn.addEventListener("click",function(){setOn(!running)});
  // browsers block autoplay, so if music was on last visit, start it on the first tap anywhere
  try{
    if(localStorage.getItem("emberMusic")==="1"){
      var go=function(){document.removeEventListener("pointerdown",go);if(!running)setOn(true)};
      document.addEventListener("pointerdown",go);
    }
  }catch(e){}
})();
</script>
